services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nutririsk
      POSTGRES_PASSWORD: nutririsk
      POSTGRES_DB: nutririsk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://nutririsk:nutririsk@postgres:5432/nutririsk
      MODEL_PATH: /app/ml/models/nutririsk_model.joblib
      FEATURE_COLUMNS_PATH: /app/ml/models/feature_columns.json
      DEMO_DATA_PATH: /app/data/demo/patient_day_features.csv
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
